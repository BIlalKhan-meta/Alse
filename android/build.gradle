buildscript {
    ext {
        // buildToolsVersion = "34.0.0"
        minSdkVersion = 28
        // compileSdkVersion = 35
        // targetSdkVersion = 35
        // ndkVersion = "26.1.10909125"
        // kotlinVersion = "2.0.0"


        buildToolsVersion = "36.0.0"
        // minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0")
        classpath('com.google.gms:google-services:4.4.2')
    }
}

apply plugin: "com.facebook.react.rootproject"

// Disable AGP lintVital tasks — they OOM Metaspace on large RN deps (e.g. react-native-video).
gradle.projectsEvaluated {
    rootProject.subprojects.each { subproject ->
        subproject.tasks.matching { it.name.toLowerCase().contains("lintvital") }.configureEach {
            enabled = false
        }
    }
    rootProject.tasks.matching { it.name.toLowerCase().contains("lintvital") }.configureEach {
        enabled = false
    }
}
