buildscript {
    ext {
        // buildToolsVersion = "34.0.0"
        minSdkVersion = 28
        // compileSdkVersion = 35
        // targetSdkVersion = 35
        // ndkVersion = "26.1.10909125"
        // kotlinVersion = "2.0.0"


        buildToolsVersion = "36.0.0"
        // minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0")
        classpath('com.google.gms:google-services:4.4.2')
    }
}

apply plugin: "com.facebook.react.rootproject"

// Cap CMake/ninja compile parallelism. AGP invokes ninja directly (not
// cmake --build), so CMAKE_BUILD_PARALLEL_LEVEL is ignored. Without this,
// ninja uses all CPU cores and clang++ often gets SIGKILL'd on 16GB Macs —
// Gradle then reports "subcommand failed" with no compiler diagnostics.
def limitCmakeParallelism = { project ->
    def androidExt = project.extensions.findByName("android")
    if (androidExt == null) return
    try {
        def cmake = androidExt.defaultConfig.externalNativeBuild.cmake
        def args = [
            "-DCMAKE_JOB_POOL_COMPILE=compile",
            "-DCMAKE_JOB_POOL_LINK=link",
            "-DCMAKE_JOB_POOLS=compile=2;link=1",
        ]
        args.each { arg ->
            if (!cmake.arguments.get().contains(arg)) {
                cmake.arguments.add(arg)
            }
        }
    } catch (Throwable ignored) {
        // Module has no externalNativeBuild/cmake — skip.
    }
}

def whenAndroidReady = { subproject, action ->
    def run = {
        if (subproject.state.executed) {
            action(subproject)
        } else {
            subproject.afterEvaluate { action(subproject) }
        }
    }
    subproject.pluginManager.withPlugin("com.android.library", run)
    subproject.pluginManager.withPlugin("com.android.application", run)
}

subprojects { subproject ->
    whenAndroidReady(subproject, limitCmakeParallelism)
}

// Disable AGP lintVital tasks — they OOM Metaspace on large RN deps (e.g. react-native-video).
gradle.projectsEvaluated {
    rootProject.subprojects.each { subproject ->
        subproject.tasks.matching { it.name.toLowerCase().contains("lintvital") }.configureEach {
            enabled = false
        }
    }
    rootProject.tasks.matching { it.name.toLowerCase().contains("lintvital") }.configureEach {
        enabled = false
    }
}
