name: "Build Android app"

on:
  push:
    branches:
      - "development"
  workflow_dispatch:  # Adding this back to allow manual triggers

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Updated to v3
        
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"
          cache: "gradle"

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Setup Node  
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'  # Added caching for faster builds

      - name: Run Yarn Install
        run: yarn install --frozen-lockfile  # Added frozen-lockfile for consistent builds
             
      # New step to add dependency override for androidx.browser
      - name: Override browser dependency
        run: |
          echo 'dependencyResolutionManagement { 
            versionCatalogs {
              libs {
                library("androidx-browser", "androidx.browser:browser:1.6.0")
              }
            }
            
            resolutionStrategy {
              eachDependency { details ->
                if (details.requested.group == "androidx.browser" && details.requested.name == "browser") {
                  details.useVersion "1.6.0"
                }
              }
            }
          }' >> ./android/settings.gradle
      
      - name: Build application
        run: |
          cd ./android
          ./gradlew assembleDebug --stacktrace  # Added stacktrace for better error reporting
          
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5  # Extended retention period

      # Commented release build - uncomment when debug build works
