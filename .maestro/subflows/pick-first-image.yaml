appId: com.blitzapp.alenga.alse
---
# Pick the first thumbnail in the system gallery picker (Android / iOS).
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          optional: true
      - tapOn:
          id: "com.google.android.documentsui:id/thumbnail"
          optional: true
      - tapOn:
          text: "Photos"
          optional: true
      - tapOn:
          point: "20%,35%"
          optional: true

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "PXGGridLayout-Info"
          index: 0
          optional: true
      - tapOn:
          text: "Photo, .*"
          index: 0
          optional: true
