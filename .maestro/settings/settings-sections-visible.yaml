appId: com.blitzapp.alenga.alse
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login.yaml
- runFlow: ../subflows/open-settings.yaml
- assertVisible: "Menu"
- assertVisible: "Create Post"
- scrollUntilVisible:
    element: "Shops"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- assertVisible: "Shops"
- scrollUntilVisible:
    element: "View Content"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- assertVisible: "View Content"
- scrollUntilVisible:
    element:
      id: "settings-logout"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- assertVisible:
    id: "settings-logout"
